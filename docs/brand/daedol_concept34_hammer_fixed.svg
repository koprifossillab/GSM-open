<title style="fill:rgb(0, 0, 0);stroke:none;color:rgb(11, 11, 11);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:anthropic-sans, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto">대돌여지도 로고 컨셉 3+4 - 손잡이 중심을 나침반 중심에 맞춘 지질 해머</title>
<desc style="fill:rgb(0, 0, 0);stroke:none;color:rgb(11, 11, 11);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:anthropic-sans, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto">진한 갈색 배경 위 금색 육각 틀 안에, 손잡이 중심이 나침반 중심과 일치하도록 다시 그린 지질 해머(평평한 타격면과 뾰족한 픽 끝)와 나침반, 금색 워드마크로 구성된 로고</desc>

