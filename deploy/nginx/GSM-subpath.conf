# GSM(대돌여지도)을 80 포트의 /GSM/ 아래에 얹는다.
#
# 까닭은 ForGIA·DiaRUGA 와 같다 — 사내 VPN 이 80 만 통과시키고, 이 머신의 80 은
# phyloserver 블록이 `server_name 172.16.116.98` 로 이미 잡고 있다. 그래서
# 호스트명 vhost 로 가르지 못하고 서브경로로 얹는다. 셋이 나란히 산다.
#
# 설치:
#   sudo cp deploy/nginx/GSM-subpath.conf /etc/nginx/snippets/GSM-subpath.conf
#   # /etc/nginx/sites-enabled/phyloserver 의 server 블록 안에 한 줄:
#   #     include snippets/GSM-subpath.conf;
#   sudo nginx -t && sudo systemctl reload nginx

# 뿌리로 들어오면 슬래시를 붙여 보낸다. 이게 없으면 Django 가 /GSM 을 못 찾는다.
# `=` 는 정확히 일치라 정규식보다 우선순위가 높다 — 아래 짧은이름 블록에
# 잡아채이지 않는다.
location = /GSM {
    return 301 /GSM/;
}

# 짧은 주소(/geomap/)와 대소문자를 틀리게 친 주소를 정식 주소로 보낸다
# (ForGIA 의 /foram/, DiaRUGA 의 /diatom/ 과 같은 갈래).
#
# **URL 은 대소문자를 가린다.** 정식 이름이 `GSM` 이라 `/gsm/` 으로 친 사람은
# 그냥 두면 404 를 본다.
#
# 이 블록이 정식 주소까지 잡아채면 **무한 루프가 된다** — nginx 는 접두 location
# 보다 정규식을 먼저 보기 때문이다. 그래서 아래 /GSM/ 블록에 `^~` 를 붙였다.
# `^~` 는 접두가 맞으면 정규식을 아예 보지 말라는 뜻이다.
location ~* ^/(gsm|geomap)(/.*)?$ {
    return 301 /GSM$2;
}

location ^~ /GSM/ {
    # **끝에 슬래시를 붙이지 않는다.** ForGIA 와 다른 점이다.
    # 저쪽은 nginx 가 접두를 떼고 Django 가 FORCE_SCRIPT_NAME 으로 다시 붙이지만,
    # 여기는 Django 가 처음부터 /GSM/ 에 붙어 있다(`GSM_URL_PREFIX`,
    # `gsmweb/urls.py`). 슬래시를 붙이면 접두가 떨어져 전부 404 가 된다.
    proxy_pass http://127.0.0.1:8094;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # 상류 타일이 늦을 때가 있다. 첫 요청이 상류 캐시를 데우는 동안
    # 길어지는 일이 있어 넉넉히 준다.
    proxy_read_timeout 90s;

    # 점묶음 업로드. settings.DATA_UPLOAD_MAX_MEMORY_SIZE 와 맞춘다.
    client_max_body_size 16m;
}

# 정적 파일(OpenLayers·CSS·JS)은 오래 들고 있어도 된다.
#
# **단 주소가 내용과 함께 바뀌어야 한다.** `immutable` 은 "이 주소는 안
# 바뀐다" 는 약속이라, 같은 주소로 새 CSS 를 내면 브라우저가 7 일간 옛 것을
# 쓴다 (005). 그래서 map.css·map.js 는 템플릿이 `?v=<내용 표>` 를 붙인다.
#
# **타일은 여기 걸리지 않는다** — 타일 주소는 /GSM/wms/ 라 /GSM/static/ 밖이고,
# 캐시 여부는 뷰가 Cache-Control 로 정한다. 인증키가 없을 때 뜨는 안내 타일은
# `no-store` 라서, 키가 생기면 곧바로 진짜 타일이 뜬다.
location ^~ /GSM/static/ {
    proxy_pass http://127.0.0.1:8094;
    proxy_set_header Host $host;
    expires 7d;
    add_header Cache-Control "public, immutable";
}
