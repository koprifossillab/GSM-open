# /srv/GSM/docker-compose.yml 에 두는 것. **운영이 이 파일로 돈다.**
#
#   cd /srv/GSM && docker compose up -d web
#   cd /srv/GSM && docker compose pull && docker compose up -d web
#
# 굽는 쪽(저장소의 deploy/docker-compose.yml)과 갈라 둔 까닭은 ForGIA 와 같다 —
# 운영 장비에 저장소를 두지 않기 위해서다. 여기에는 이미지 이름과 마운트만 있다.

name: gsm

services:
  web:
    image: koprifossillab/gsm:${GSM_TAG:-latest}
    restart: unless-stopped
    user: "1000:1000"
    env_file: .env
    environment:
      TZ: Asia/Seoul
      GSM_DB_PATH: /srv/GSM/db/GSM.db
      GSM_TILE_CACHE_DIR: /srv/GSM/tiles
      GSM_DEBUG: "0"
      GSM_URL_PREFIX: "GSM/"
    volumes:
      - /srv/GSM/db:/srv/GSM/db
      # cron 이 부르는 스크립트 — 뜰 때 이미지의 것을 여기 깐다 (deploy/scripts/install.sh, koprifossillab 005)
      - /srv/GSM/scripts:/srv/GSM/scripts
      # 타일 캐시는 루트 SSD 가 아니라 8 TB 하드에 둔다 (wetherilli 082)
      - /data/GSM/tiles:/srv/GSM/tiles
    ports:
      - "127.0.0.1:8094:9090"
    # 극지연구소 KPDC — 이 서버가 먼저 묻는 DNS(172.16.200.30)가 kopri.re.kr 을 NXDOMAIN 으로 답해(2026-09-30)
    # 컨테이너가 이름을 못 찾는다. 다른 DNS(203.250.179.4·8.8.8.8)가 주는 주소를 박아 둔다. KPDC 의 주소가 바뀌면
    # 조용히 깨지므로, 서버의 DNS 가 고쳐지면 이 두 줄을 지운다 (wetherilli 095)
    extra_hosts:
      - "kpdcgeo.kopri.re.kr:203.250.180.198"
      - "kpdc.kopri.re.kr:203.250.180.198"
